<header>
    <div>
        <img id="logo" src="assets/logo_kp.png" [alt]="'HEADER.LOGO_ALT' | translate">
    </div>

    <div>
        <button
            class="launge-button"
            [class.selected-language]="selectedLanguage === 'EN'"
            type="button"
            (click)="setLanguage('en')"
        >
            EN
        </button>
        <button
            class="launge-button"
            [class.selected-language]="selectedLanguage === 'DE'"
            type="button"
            (click)="setLanguage('de')"
        >
            DE
        </button>
        <button id="menuButton" type="button" [attr.aria-label]="'HEADER.MENU' | translate"><img id="menuButtenImg" src="assets/burger-menu-S3-FFFCF3.svg" alt=""></button>
    </div>
</header>
