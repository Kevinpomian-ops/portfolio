<section id="references">
    <h2>{{ 'REFERENCES.TITLE' | translate }}</h2>
    <p>{{ 'REFERENCES.INTRO' | translate }}</p>
    <div class="ref">

        @for (reference of references; track reference.name) {
        <div class="reference">
            <img [src]="referencesLogo" [alt]="reference.name + ' logo'">
            <p class="reference-text">{{ reference.reference | translate }}</p>
            <p class="reference-name">{{ reference.name }}</p>
        </div>
        }
    </div>

    <div class="arrow-right">
        <img src="/assets/pfeil.svg" alt="">
    </div>

</section>
